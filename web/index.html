<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pu-cli</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<div id="shell">

  <header>
    <div class="brand">· 朴 ·</div>
    <div class="header-right">
      <button id="sidebar-toggle" title="Hide or show the panel" aria-label="Toggle panel">▤</button>
    </div>
  </header>

  <div id="stage">

    <main>
      <div id="messages"></div>

      <div id="notice-bar" hidden></div>

      <div id="approval-bar" hidden>
        <div class="approval-head">
          <span class="approval-label">Run this command?</span>
          <button id="approval-command" class="approval-command" title="Show the whole command"></button>
        </div>
        <input id="approval-note" placeholder="Optional note for the model…">
        <div class="approval-actions">
          <button id="approval-deny">Deny <kbd>Esc</kbd></button>
          <button id="approval-allow">Approve <kbd>Enter</kbd></button>
        </div>
      </div>

      <div id="composer">
        <!-- The field and the button, nothing else: what is chosen between messages lives in
             the panel, and what is merely read lives on the status bar below. -->
        <div id="composer-row">
          <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
          <button id="send">Send</button>
        </div>
      </div>
    </main>

    <aside id="sidebar">
      <div class="panel">
        <div class="panel-title">Session</div>
        <label class="field">
          <span>Agent</span>
          <select id="agent-select"></select>
        </label>
        <!-- One row per setting the server offers, drawn from /api/settings: a setting added
             there appears here without this file changing. How much reasoning to ask for is a
             row like any other now. -->
        <div id="settings-rows"></div>
        <button id="settings-reset" type="button" title="Drop this session's changes and go back to the agent's configuration">
          Reset to the agent's configuration
        </button>
      </div>

      <div class="panel">
        <div class="panel-title">Usage</div>
        <div id="context-usage" title="How much context the last reply ran against"></div>
        <div class="context-bar"><div id="context-fill"></div></div>
        <!-- What the whole conversation has spent, summed by the server. -->
        <div id="usage-total" class="usage-total" title="What this conversation has spent so far"></div>
      </div>

      <div class="panel">
        <div class="panel-title">Backend</div>
        <dl id="panel-backend" class="kv">
          <dt>Type</dt><dd id="kb-type">—</dd>
          <dt>Model</dt><dd id="kb-model">—</dd>
          <dt>Host</dt><dd id="kb-host">—</dd>
        </dl>
      </div>

      <div class="panel">
        <div class="panel-title">Tools</div>
        <ul id="panel-tools" class="tool-list"></ul>
      </div>
    </aside>

  </div>

  <!-- A read-out, not a control: what the session is, so a folded panel costs no state.
       It spans the shell rather than sitting in the column, so the panel opening and
       closing does not move it. -->
  <div id="status-bar">
    <span class="status-item">
      <span id="conn-dot" class="conn-dot" title="Connection"></span>
      <span id="conn-text">connecting</span>
    </span>
    <span class="status-item" id="status-agent" title="The agent that answers">—</span>
    <span class="status-item" id="status-thinking" title="How much reasoning is asked for">—</span>
    <span class="status-right">
      <span class="status-item" id="status-backend" title="The gateway and model">—</span>
      <span class="status-item" id="status-tools" title="Tools this agent can reach">—</span>
      <span class="status-item" id="status-context" title="Context the last reply ran against">—</span>
    </span>
  </div>

  <div id="scrim" hidden></div>
</div>

<script src="layout.js"></script>
<script src="approval.js"></script>
<script src="state.js"></script>
<script src="block-thinking.js"></script>
<script src="block-tool.js"></script>
<script src="block-node.js"></script>
<script src="message.js"></script>
<script src="transcript.js"></script>
<script src="panel.js"></script>
<script src="notice.js"></script>
<script src="history.js"></script>
<script src="ws.js"></script>
<script src="session.js"></script>
<script src="composer.js"></script>
<script src="app.js"></script>
</body>
</html>
