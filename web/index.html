<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pu-cli</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/core.min.js"></script>
</head>
<body>
<header>
  <h1>· 朴 ·</h1>
  <select id="agent-select"></select>
  <select id="thinking-select" title="How much reasoning to ask for" hidden>
    <option value="auto" title="Follow the agent's configuration">Thinking: Auto</option>
    <option value="none" title="Ask the backend not to think">Thinking: Off</option>
    <option value="low" title="A little reasoning">Thinking: Low</option>
    <option value="medium" title="Balanced reasoning">Thinking: Medium</option>
    <option value="high" title="As much reasoning as the backend allows">Thinking: High</option>
  </select>
</header>
<div id="messages"></div>
<div id="composer">
  <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
  <button id="send">Send</button>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
