<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pu-cli · Web Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>pu-cli · Web Chat</h1>
  <select id="agent-select"></select>
  <button id="clear-btn" title="Clear conversation history">New chat</button>
</header>

<div id="messages"></div>

<div id="composer">
  <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
  <button id="send">Send</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
