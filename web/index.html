<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pu-cli · Web Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --text-dim: #9aa3b2;
    --accent: #4f8cff;
    --user: #2b4a8f;
    --assistant: #22262f;
    --error: #e5534b;
    --ok: #3fb68b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #agent-select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 13px;
    max-width: 240px;
  }
  #session-status {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
  }
  header button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  header button:hover { border-color: var(--accent); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.55; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--assistant); border: 1px solid var(--border); }
  .msg.error { align-self: flex-start; background: rgba(229,83,75,0.12); border: 1px solid var(--error); color: #ffb3ad; }
  .msg.system { align-self: center; background: transparent; color: var(--text-dim); font-size: 12px; border: none; padding: 2px 8px; }
  .msg .role { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .thinking {
    color: var(--text-dim); font-style: italic; font-size: 13px;
    border-left: 3px solid var(--accent); padding-left: 10px; margin: 6px 0;
  }
  #composer {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    min-height: 44px;
    max-height: 160px;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing::after {
    content: "";
    display: inline-block;
    width: 5px; height: 14px;
    background: var(--text-dim);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <h1>pu-cli · Web Chat</h1>
  <select id="agent-select"></select>
  <button id="clear-btn" title="Clear conversation history">New chat</button>
  <span id="session-status">Loading session…</span>
</header>

<div id="messages"></div>

<div id="composer">
  <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
  <button id="send">Send</button>
</div>

<script type="module">
"use strict";

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const clearBtn = document.getElementById("clear-btn");
const statusEl = document.getElementById("session-status");
const agentSelect = document.getElementById("agent-select");

function addMessage(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "user" : (role === "error" ? "error" : "assistant"));
  const label = document.createElement("span");
  label.className = "role";
  label.textContent = role === "user" ? "You" : "Assistant";
  el.appendChild(label);
  el.appendChild(document.createTextNode(text == null ? "" : String(text)));
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

function addSystem(text) {
  const el = document.createElement("div");
  el.className = "msg system";
  el.textContent = text;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadSession() {
  try {
    const res = await fetch("/api/session");
    const data = await res.json();
    if (data.ok) {
      const model = data.backend_model ? " · " + data.backend_model : "";
      statusEl.textContent = "Agent: " + (data.agent_name || "?") +
        " · Backend: " + (data.backend_type || "?") + model;
      // 设置下拉框选中当前 Agent
      if (data.agent_name) {
        agentSelect.value = data.agent_name;
      }
    } else {
      statusEl.textContent = "Session unavailable: " + (data.error || "unknown");
    }
  } catch (e) {
    statusEl.textContent = "Session unavailable";
  }
}

async function loadHistory() {
  try {
    const res = await fetch("/api/history");
    const history = await res.json();
    if (Array.isArray(history)) {
      for (const msg of history) {
        if (msg.role === "system") continue;
        addMessage(msg.role, msg.content);
      }
    }
  } catch (e) {
    console.warn("Failed to load history:", e);
  }
}

async function loadAgents() {
  try {
    const res = await fetch("/api/agents");
    const data = await res.json();
    agentSelect.innerHTML = "";
    for (const agent of data.agents || []) {
      const opt = document.createElement("option");
      opt.value = agent.name;
      opt.textContent = agent.name + (agent.description ? " (" + agent.description + ")" : "");
      agentSelect.appendChild(opt);
    }
    agentSelect.addEventListener("change", async function() {
      const name = this.value;
      try {
        const res = await fetch("/api/agent/switch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ agent_name: name })
        });
        const data = await res.json();
        if (data.success) {
          messagesEl.innerHTML = "";
          addSystem("Switched to agent: " + name);
          await loadSession();
          await loadHistory();
        } else {
          addSystem("Switch failed: " + (data.error || "unknown"));
        }
      } catch (e) {
        addSystem("Switch failed: " + e.message);
      }
    });
  } catch (e) {
    console.warn("Failed to load agents:", e);
  }
}

// In-flight request state; the Send button turns into Cancel while it runs.
let currentRequestId = null;
let currentController = null;

function showError(msgEl, text) {
  msgEl.classList.remove("typing");
  msgEl.classList.remove("assistant");
  msgEl.classList.add("error");
  msgEl.textContent = "";
  const label = document.createElement("span");
  label.className = "role";
  label.textContent = "Error";
  msgEl.appendChild(label);
  msgEl.appendChild(document.createTextNode(text));
}

async function sendMessage() {
  if (currentController) return;
  const text = inputEl.value.trim();
  if (!text) return;

  const requestId = Date.now() + "-" + Math.random().toString(36).slice(2);
  const controller = new AbortController();
  currentRequestId = requestId;
  currentController = controller;

  inputEl.value = "";
  autoResize();
  addMessage("user", text);

  sendBtn.textContent = "Cancel";
  sendBtn.disabled = false;
  const pending = addMessage("assistant", "");
  pending.classList.add("typing");
  pending.appendChild(document.createTextNode("Thinking"));

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, request_id: requestId }),
      signal: controller.signal
    });
    const data = await res.json();
    pending.classList.remove("typing");
    pending.textContent = "";

    if (data.success) {
      pending.appendChild(document.createTextNode(data.content || "(empty response)"));
    } else {
      showError(pending, data.error || "Request failed");
    }
  } catch (e) {
    if (e && e.name === "AbortError") {
      showError(pending, "Request cancelled.");
    } else {
      showError(pending, "Network error: " + (e && e.message ? e.message : e));
    }
  } finally {
    currentRequestId = null;
    currentController = null;
    sendBtn.textContent = "Send";
    sendBtn.disabled = false;
    inputEl.focus();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

async function cancelRequest() {
  const controller = currentController;
  const requestId = currentRequestId;
  if (controller) controller.abort();
  if (requestId) {
    try {
      await fetch("/api/chat/cancel", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ request_id: requestId })
      });
    } catch (e) {
      console.warn("Cancel request failed:", e);
    }
  }
}

async function clearChat() {
  clearBtn.disabled = true;
  try {
    const res = await fetch("/api/clear", { method: "POST" });
    const data = await res.json();
    messagesEl.innerHTML = "";
    addSystem(data.success ? "Conversation cleared." : "Clear failed: " + (data.error || "unknown"));
    await loadSession();
    await loadHistory();
  } catch (e) {
    messagesEl.innerHTML = "";
    addSystem("Clear failed: " + e.message);
  } finally {
    clearBtn.disabled = false;
  }
}

function autoResize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
}

sendBtn.addEventListener("click", () => {
  if (currentController) {
    cancelRequest();
  } else {
    sendMessage();
  }
});
clearBtn.addEventListener("click", clearChat);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (!currentController) sendMessage();
  }
});
inputEl.addEventListener("input", autoResize);

addSystem("Connected to pu serve. Send a message to start chatting.");
await loadSession();
await loadHistory();
await loadAgents();
</script>
</body>
</html>
