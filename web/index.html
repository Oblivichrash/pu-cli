<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pu-cli</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<div id="shell">

  <header>
    <div class="brand">· 朴 ·</div>
    <!-- The workspace this page is attached to, and the other servers on the machine. The
         name is a workspace rather than a port because that is the thing a reader knows;
         the panel below lists the rest, and stays folded while there is only one. -->
    <div class="header-servers">
      <button id="server-current" class="server-current" title="The workspace this page is talking to">—</button>
      <button id="server-toggle" title="Servers on this machine" aria-label="Servers on this machine">▾</button>
      <ul id="server-list" class="server-list" hidden></ul>
    </div>
    <div class="header-right">
      <button id="sidebar-toggle" title="Hide or show the panel" aria-label="Toggle panel">▤</button>
    </div>
  </header>

  <div id="stage">

    <main>
      <div id="messages"></div>

      <div id="notice-bar" hidden></div>

      <div id="approval-bar" hidden>
        <div class="approval-head">
          <span class="approval-label">Run this command?</span>
          <button id="approval-command" class="approval-command" title="Show the whole command"></button>
        </div>
        <input id="approval-note" placeholder="Optional note for the model…">
        <div class="approval-actions">
          <button id="approval-deny">Deny <kbd>Esc</kbd></button>
          <button id="approval-allow">Approve <kbd>Enter</kbd></button>
        </div>
      </div>

      <div id="composer">
        <!-- The field and the button, nothing else: what is chosen between messages lives in
             the panel, and what is merely read lives on the status bar below. -->
        <div id="composer-row">
          <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
          <button id="send">Send</button>
        </div>
      </div>
    </main>

    <aside id="sidebar">
      <div class="panel">
        <div class="panel-title">Usage</div>
        <div id="context-usage" title="How much context the last reply ran against"></div>
        <div class="context-bar"><div id="context-fill"></div></div>
        <!-- What the whole conversation has spent, summed by the server. -->
        <div id="usage-total" class="usage-total" title="What this conversation has spent so far"></div>
      </div>

      <div class="panel">
        <!-- The column is for what the reader watches; everything that is chosen lives in the
             dialog behind this button. The gateway and the model are repeated here as text
             because they are the two facts a reader checks between turns, and opening a dialog
             to read them would be the cost of a control nobody is using. -->
        <div class="panel-title">Configuration</div>
        <div id="summary-backend" class="summary-line" title="The gateway and model that answer">—</div>
        <button id="config-open" type="button" title="Choose the backend and this session's settings">
          Configure agent…
        </button>
      </div>
    </aside>

  </div>

  <!-- A read-out, not a control: what the session is, so a folded panel costs no state.
       It spans the shell rather than sitting in the column, so the panel opening and
       closing does not move it. -->
  <div id="status-bar">
    <span class="status-item">
      <span id="conn-dot" class="conn-dot" title="Connection"></span>
      <span id="conn-text">connecting</span>
    </span>
    <span class="status-item" id="status-agent" title="The agent that answers">—</span>
    <span class="status-item" id="status-thinking" title="How much reasoning is asked for">—</span>
    <!-- The gateway and the model are not here. They are a fact about the configuration, and
         they do not change from one turn to the next, so the bar spent a third of its width
         repeating what the Backend panel already holds. What is left is what moves: the tools
         the agent can reach and the context the last reply ran against. -->
    <span class="status-right">
      <span class="status-item" id="status-tools" title="Tools this agent can reach">—</span>
      <span class="status-item" id="status-context" title="Context the last reply ran against">—</span>
    </span>
  </div>

  <!-- Everything the reader writes rather than reads, in one place. It is a dialog rather than
       three panels in the column because these are one act -- pick what answers, then adjust
       how it answers -- and the column had them separated by the usage figures, which are the
       opposite kind of thing. A native dialog also brings the focus trap and the Escape key,
       which a hand-rolled overlay gets wrong in a page that already binds Escape elsewhere. -->
  <dialog id="config-dialog" aria-labelledby="config-title">
    <form method="dialog" class="config-head">
      <div id="config-title">Agent configuration</div>
      <button type="submit" class="config-close" title="Close (Esc)" aria-label="Close">✕</button>
    </form>

    <div class="config-body">
      <!-- The agent itself, stated rather than chosen: it is fixed by its file, and a page that
           offered to change it would be offering something no route accepts. -->
      <section class="config-section">
        <div class="panel-title">Agent</div>
        <label class="field">
          <span>Name</span>
          <span id="config-agent-name" class="agent-name">—</span>
        </label>
      </section>

      <!-- The backend is the one thing here the operator still chooses: which gateway and model
           answer is a runtime decision written back to the agent's file. The model list is asked
           of the gateway, so a gateway that cannot be asked leaves a text field instead of a
           stale menu. -->
      <section class="config-section">
        <div class="panel-title">Backend</div>
        <label class="field">
          <span>Gateway</span>
          <select id="kb-type"></select>
        </label>
        <label class="field">
          <span>Model</span>
          <select id="kb-model"></select>
          <input id="kb-model-text" type="text" hidden>
        </label>
        <dl class="kv"><dt>Host</dt><dd id="kb-host">—</dd></dl>
        <div id="kb-error" class="backend-error" hidden></div>
      </section>

      <section class="config-section">
        <div class="panel-title">Session settings</div>
        <!-- One row per setting the server offers, drawn from /api/settings: a setting added
             there appears here without this file changing. How much reasoning to ask for is a
             row like any other. -->
        <div id="settings-rows"></div>
        <button id="settings-reset" type="button" title="Drop this session's changes and go back to the agent's configuration">
          Reset to the agent's configuration
        </button>
      </section>

      <section class="config-section">
        <div class="panel-title">Tools</div>
        <ul id="panel-tools" class="tool-list"></ul>
      </section>
    </div>
  </dialog>

  <div id="scrim" hidden></div>
</div>

<script src="layout.js"></script>
<script src="approval.js"></script>
<script src="blocks.js"></script>
<script src="state.js"></script>
<script src="api.js"></script>
<script src="block-thinking.js"></script>
<script src="block-tool.js"></script>
<script src="block-subtask.js"></script>
<script src="block-node.js"></script>
<script src="message.js"></script>
<script src="contextmenu.js"></script>
<script src="transcript.js"></script>
<script src="panel.js"></script>
<script src="servers.js"></script>
<script src="notice.js"></script>
<script src="history.js"></script>
<script src="ws.js"></script>
<script src="session.js"></script>
<script src="composer.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
