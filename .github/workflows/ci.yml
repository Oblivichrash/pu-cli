name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y catch2 libspdlog-dev libboost-system-dev libboost-program-options-dev libboost-json-dev libssl-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install catch2 spdlog boost openssl

    - name: Cache vcpkg binaries (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.vcpkg-cache
        # Bump the suffix to invalidate when the dependency set changes.
        key: vcpkg-windows-v1

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      env:
        VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
        # Default x64-windows builds debug and release for every port; CI only needs release.
        VCPKG_BUILD_TYPE: release
      run: |
        # The binary cache directory must exist before vcpkg runs (it is absent on a cache miss).
        New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        # vcpkg splits Boost into per-library ports; BeastHttpClient also needs asio and beast.
        vcpkg install catch2 spdlog boost-system boost-program-options boost-json boost-asio boost-beast openssl
        echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

    # The tree is formatted with the version pinned here; the one apt ships
    # changes with each runner image, which would fail the check below on files
    # nobody touched.
    - name: Install clang-format (Linux)
      if: runner.os == 'Linux'
      run: |
        pipx install clang-format==22.1.3
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Check formatting (Linux)
      if: runner.os == 'Linux'
      run: |
        clang-format --version
        clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Test
      run: ctest --test-dir build -C Release --output-on-failure
