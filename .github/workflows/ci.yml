name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Cache Boost source build (Linux)
      if: runner.os == 'Linux'
      id: boost-cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/boost-install
        key: boost-1.86-linux-gcc

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y catch2 libspdlog-dev libssl-dev libboost-all-dev

    # Ubuntu 24.04 ships Boost 1.83, where boost::json::value{object{...}} builds a one-element
    # array instead of the object. CMakeLists.txt requires 1.84, so build that floor from source.
    - name: Build Boost (Linux)
      if: runner.os == 'Linux' && steps.boost-cache.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o boost.tar.bz2 https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.bz2
        tar xjf boost.tar.bz2
        cd boost_1_86_0
        ./bootstrap.sh --with-libraries=system,program_options,json
        ./b2 -j"$(nproc)" link=static,shared install --prefix="$GITHUB_WORKSPACE/boost-install"

    - name: Point CMake at the built Boost (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "BOOST_ROOT=$GITHUB_WORKSPACE/boost-install" >> "$GITHUB_ENV"
        echo "Boost_ROOT=$GITHUB_WORKSPACE/boost-install" >> "$GITHUB_ENV"
        echo "Boost_DIR=$GITHUB_WORKSPACE/boost-install/lib/cmake/Boost-1.86.0" >> "$GITHUB_ENV"

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install catch2 spdlog boost openssl

    - name: Cache vcpkg binaries (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.vcpkg-cache
        # Bump the suffix to invalidate when the dependency set changes.
        key: vcpkg-windows-v1

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      env:
        VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
        # Default x64-windows builds debug and release for every port; CI only needs release.
        VCPKG_BUILD_TYPE: release
      run: |
        # The binary cache directory must exist before vcpkg runs (it is absent on a cache miss).
        New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        # vcpkg splits Boost into per-library ports; BeastHttpClient also needs asio and beast.
        vcpkg install catch2 spdlog boost-system boost-program-options boost-json boost-asio boost-beast openssl
        echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Test
      run: ctest --test-dir build -C Release --parallel --output-on-failure
