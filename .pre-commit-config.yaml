# Checked by CI, so a local run is the same check rather than a guess.
repos:
  - repo: local
    hooks:
      - id: spdx-header
        name: SPDX header on every C++ file
        language: script
        entry: scripts/check-spdx.sh
        types_or: [c++, c]
        pass_filenames: true
      - id: doc-links
        name: every link resolves, and every heading it names exists
        language: script
        entry: scripts/check-links.py
        types_or: [markdown]
        pass_filenames: false
